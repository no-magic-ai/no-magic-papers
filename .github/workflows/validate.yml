name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  slug-namespace:
    name: slug namespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reject paper slugs with script prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = sorted(path.as_posix() for path in Path("papers").glob("micro*.md"))
          if bad:
              raise SystemExit("paper cards must not use micro* slugs: " + ", ".join(bad))
          PY

  index-freshness:
    name: index freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify generated index bytes
        run: python scripts/generate_index.py --check

  frontmatter-schema:
    name: frontmatter schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate paper cards and lessons
        run: python scripts/generate_index.py --validate

  validator-tests:
    name: validator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run unit tests
        run: python -m unittest discover -s tests

  cross-repo-invariants:
    name: cross-repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: no-magic-papers
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: no-magic-ai/no-magic
          ref: main
          path: no-magic
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: no-magic-ai/no-magic-viz
          ref: main
          path: no-magic-viz
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate the explicit repository cohort
        working-directory: no-magic-papers
        env:
          COHORT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && 'published' || 'candidate' }}
        run: |
          set -euo pipefail
          python scripts/validate_invariants.py \
            --catalog ../no-magic/docs/catalog.json \
            --core ../no-magic \
            --viz ../no-magic-viz \
            --papers papers \
            --require-paper-slug yes \
            --cohort "$COHORT" \
            --core-revision "$(git -C ../no-magic rev-parse HEAD)" \
            --papers-revision "$(git rev-parse HEAD)" \
            --viz-revision "$(git -C ../no-magic-viz rev-parse HEAD)" \
            --receipt "$RUNNER_TEMP/cohort-receipt.json"
