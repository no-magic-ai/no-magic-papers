name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  slug-namespace:
    name: slug namespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: reject paper slugs with script prefix
        run: |
          python - <<'PY'
          from pathlib import Path
          bad = sorted(path.as_posix() for path in Path("papers").glob("micro*.md"))
          if bad:
              raise SystemExit("paper cards must not use micro* slugs: " + ", ".join(bad))
          PY

  index-freshness:
    name: index freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: verify generated index bytes
        run: python scripts/generate_index.py --check

  frontmatter-schema:
    name: frontmatter schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate paper cards and lessons
        run: python scripts/generate_index.py --validate

  validator-tests:
    name: validator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run unit tests
        run: python -m unittest discover -s tests

  cross-repo-invariants:
    name: cross-repo invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: resolve cohort revisions once
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          PAPERS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          resolve() {
            local sha
            sha=$(git ls-remote --exit-code "https://github.com/no-magic-ai/$1.git" refs/heads/main | cut -f1)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "cannot resolve $1 main" >&2; exit 1; }
            echo "$sha"
          }
          [[ "$PAPERS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "invalid papers revision" >&2; exit 1; }
          if [ "$EVENT_NAME" = "push" ] && [ "$GIT_REF" = "refs/heads/main" ]; then
            cohort=published
          else
            cohort=candidate
          fi
          {
            echo "papers=$PAPERS_SHA"
            echo "core=$(resolve no-magic)"
            echo "viz=$(resolve no-magic-viz)"
            echo "cohort=$cohort"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.refs.outputs.papers }}
          path: no-magic-papers
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: no-magic-ai/no-magic
          ref: ${{ steps.refs.outputs.core }}
          path: no-magic
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: no-magic-ai/no-magic-viz
          ref: ${{ steps.refs.outputs.viz }}
          path: no-magic-viz
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: validate the explicit repository cohort
        working-directory: no-magic-papers
        env:
          COHORT: ${{ steps.refs.outputs.cohort }}
          CORE_SHA: ${{ steps.refs.outputs.core }}
          PAPERS_SHA: ${{ steps.refs.outputs.papers }}
          VIZ_SHA: ${{ steps.refs.outputs.viz }}
        run: |
          python scripts/validate_invariants.py \
            --catalog ../no-magic/docs/catalog.json \
            --core ../no-magic \
            --viz ../no-magic-viz \
            --papers papers \
            --require-paper-slug yes \
            --cohort "$COHORT" \
            --core-revision "$CORE_SHA" \
            --papers-revision "$PAPERS_SHA" \
            --viz-revision "$VIZ_SHA" \
            --receipt "$RUNNER_TEMP/cohort-receipt.json"
      - name: retain the cohort receipt
        uses: actions/upload-artifact@v4
        with:
          name: cohort-receipt-${{ steps.refs.outputs.cohort }}-${{ steps.refs.outputs.papers }}
          path: ${{ runner.temp }}/cohort-receipt.json
          if-no-files-found: error
          retention-days: 90
